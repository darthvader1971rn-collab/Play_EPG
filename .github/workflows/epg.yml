name: Generate PlayNOW EPG

on:
  schedule:
    - cron: '0 3,15 * * *' # Uruchamia codziennie o 03:00 i 15:00 UTC
  workflow_dispatch: # Pozwala na ręczne uruchomienie z panelu GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG Generator
        run: python epg_generator.py

      - name: Commit and Push EPG
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add releases/epg.xml
          # Sprawdź, czy są zmiany do zacommitowania
          git diff --quiet && git diff --staged --quiet || git commit -m "Aktualizacja EPG (-7/+7 dni)"
          git push